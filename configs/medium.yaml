model_name: medium-experiment
runs_dir: runs
data:
  path: data/occultisms_29k.txt
  val_fraction: 0.05
  vocab:
    extend_from_data: false
model:
  preset: medium
  block_size: 256
  dropout: 0.15
train:
  batch_size: 48
  max_steps: 30000
  lr: 0.00025
  min_lr: 0.000025
  warmup_steps: 300
  eval_interval: 250
  eval_iters: 100
  log_interval: 10
  sample_interval: 500
  checkpoint_interval: 250
  device: auto
log:
  attention_stats: true
  prompts: ["", "The ", "Once "]
  sample_tokens: 300

