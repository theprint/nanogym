model_name: tiny-smoke
runs_dir: runs
data:
  path: data/occultisms_29k.txt
  val_fraction: 0.1
  vocab:
    extend_from_data: false
model:
  preset: tiny
  block_size: 64
  dropout: 0.1
train:
  batch_size: 8
  max_steps: 250
  lr: 0.0006
  min_lr: 0.00006
  warmup_steps: 20
  eval_interval: 25
  eval_iters: 10
  log_interval: 5
  sample_interval: 50
  checkpoint_interval: 25
  device: auto
log:
  prompts: ["", "Once "]
  sample_tokens: 120

