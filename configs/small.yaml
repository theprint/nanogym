model_name: small-experiment
runs_dir: runs
data:
  path: data/occultisms_29k.txt
  val_fraction: 0.05
  vocab:
    extend_from_data: false
model:
  preset: small
  block_size: 256
  dropout: 0.15
train:
  batch_size: 64
  max_steps: 20000
  lr: 0.0003
  min_lr: 0.00003
  warmup_steps: 200
  eval_interval: 250
  eval_iters: 100
  log_interval: 10
  sample_interval: 500
  checkpoint_interval: 250
  device: auto
log:
  prompts: ["", "The ", "Once "]
  sample_tokens: 300

