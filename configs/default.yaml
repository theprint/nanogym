# Every key is documented here. Copy this file for a named experiment.
model_name: nanogym-run
runs_dir: runs
data:
  path: data/occultisms_29k.txt
  val_fraction: 0.05
  vocab:
    extend_from_data: false
model:
  preset: small
  block_size: 256
  dropout: 0.15
  bias: true
train:
  batch_size: 64
  max_steps: 20000
  lr: 0.0003
  min_lr: 0.00003
  lr_schedule: cosine
  warmup_steps: 200
  grad_clip: 1.0
  eval_interval: 250
  eval_iters: 100
  log_interval: 10
  sample_interval: 500
  checkpoint_interval: 250
  seed: 1337
  device: auto
  dtype: auto
  num_workers: 0
log:
  attention_stats: false
  prompts: ["", "<bos>"]
  sample_tokens: 300
  temperature: 0.8

